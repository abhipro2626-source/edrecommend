<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <style>
    .eye { transform-origin: center; transform-box: fill-box; animation: blink 4.5s infinite; }
    .ant { transform-origin: 40px 16px; animation: wiggle 3s ease-in-out infinite; }
    .glow { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
  </defs>
  <g class="ant"><path d="M40 16v-7" stroke="#9b5cff" stroke-width="3" stroke-linecap="round"/><circle class="glow" cx="40" cy="7" r="4" fill="#c4a6ff"/></g>
  <rect x="14" y="16" width="52" height="42" rx="16" fill="url(#b)"/>
  <rect x="21" y="25" width="38" height="22" rx="11" fill="#0b0d14"/>
  <ellipse class="eye" cx="32" cy="36" rx="3.6" ry="4.6" fill="#7df0ff"/>
  <ellipse class="eye" cx="48" cy="36" rx="3.6" ry="4.6" fill="#7df0ff"/>
  <path d="M36 51q4 3 8 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".85"/>
  <rect x="9" y="31" width="5" height="12" rx="2.5" fill="#6d6af8"/>
  <rect x="66" y="31" width="5" height="12" rx="2.5" fill="#6d6af8"/>
  <rect x="26" y="60" width="28" height="12" rx="6" fill="url(#b)" opacity=".8"/>
</svg>
